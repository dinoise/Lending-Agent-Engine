name: CI/CD for Vertex AI Agent Engine

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy-agent-engine:
    name: Deploy Agent Engine
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-aiplatform[adk,agent-engines] google-adk python-dotenv google-auth tqdm requests deprecated llama_index

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Deploy Agent Engine (Production - Update)
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          ENV: prod
          AGENT_ENGINE_ID: ${{ secrets.AGENT_ENGINE_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          STAGING_BUCKET: ${{ secrets.STAGING_BUCKET }}
          RAG_CORPUS: ${{ secrets.RAG_CORPUS }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          ROOT_AGENT_MODEL: ${{ secrets.ROOT_AGENT_MODEL }}
        run: |
          python deployment/deploy.py --update --resource-id=${{ secrets.AGENT_ENGINE_ID }}

      - name: Deploy Agent Engine (Development - Update)
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ENV: dev
          AGENT_ENGINE_ID: ${{ secrets.AGENT_ENGINE_ID_DEV }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          STAGING_BUCKET: ${{ secrets.STAGING_BUCKET }}
          RAG_CORPUS: ${{ secrets.RAG_CORPUS }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          ROOT_AGENT_MODEL: ${{ secrets.ROOT_AGENT_MODEL }}
        run: |
          python deployment/deploy.py --update --resource-id=${{ secrets.AGENT_ENGINE_ID_DEV }}
