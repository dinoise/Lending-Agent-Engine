[project]
name = "maxiagent"
version = "0.0.5"
description = "Agent for Maxikash that aswers questions about credits, calculates quotations and search catalogs of motorcycles in Google"
authors = [
        { name = "Hector Aguilar", email = "hector.aguilar@estrategia52.com" },
]

license = "Apache License 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# ─── Configuración y validación ───────────────────────────────
pydantic-settings = "^2.8.1"
tabulate = "^0.9.0"
cryptography = "^45.0.6"
marshmallow-sqlalchemy = "^1.4.2"

# ─── Google Cloud SDKs ────────────────────────────────────────
google-auth = "^2.36.0"
google-adk = "^1.0.0"
google-cloud-aiplatform = { extras = ["adk", "agent-engines"], version = "^1.93.0" }
google-cloud-discoveryengine = "^0.13.11"
google-cloud-secret-manager = "^2.23.0"

# ─── Integración con LangChain / LlamaIndex ───────────────────
langchain-google-vertexai = "^2.0.28"
llama-index = "^0.12"

# ─── Bases de datos ───────────────────────────────────────────
SQLAlchemy = "^2.0.43"
psycopg2-binary = "^2.9.10"
pgvector = "^0.4.1"

# ─── HTTP y Requests ──────────────────────────────────────────
requests = "^2.32.3"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
scikit-learn = "^1.6.1"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.26.0"
black = "^25.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"