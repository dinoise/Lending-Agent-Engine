[project]
name = "maxiagent"
version = "0.0.5"
description = "Agent that answers questions about credits, calculates quotations and search catalogs of motorcycles in Google"
authors = [
        { name = "Hector Aguilar", email = "hector.aguilar@estrategia52.com" },
]

license = "Apache License 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# ─── Configuración y validación ───────────────────────────────
pydantic-settings = "^2.8.1"
tabulate = "^0.9.0"

# ─── Google Cloud SDKs ────────────────────────────────────────
google-auth = "^2.36.0"
google-adk = "^1.15.1"
google-cloud-aiplatform = { extras = ["adk", "agent-engines"], version = "^1.118.0" }
google-cloud-discoveryengine = "^0.13.11"
google-cloud-secret-manager = "^2.23.0"
google-api-python-client = "^2.159.0"

# ─── Integración con LangChain / LlamaIndex ───────────────────
langchain-google-vertexai = "^2.0.28"
llama-index = "^0.12"

# ─── HTTP y Requests ──────────────────────────────────────────
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"

# ─── Utilidades ───────────────────────────────────────────────
python-dotenv = "^1.0.0"
tqdm = "^4.67.1"
deprecated = "^1.2.15"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
scikit-learn = "^1.6.1"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.26.0"
black = "^25.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"